name: Paving pattern inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pattern-inspection.yml'
      - 'scripts/pattern-inspect.mjs'
      - 'e2e/fixtures/pattern-stage.html'
      - 'src/game/patterns.ts'
      - 'src/render/paver-color.ts'
      - 'src/render/stone-field.ts'
      - 'src/render/world.ts'
permissions:
  contents: read
concurrency:
  group: pattern-inspection-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect real pattern geometry at native 1920x1080
        timeout-minutes: 12
        run: node scripts/pattern-inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paving-pattern-evidence
          path: artifacts/pattern-inspection/
          retention-days: 14
          if-no-files-found: error
