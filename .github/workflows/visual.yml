name: Visual game verification
on:
  workflow_dispatch:
  push:
    branches: [feat/restore-complete-game]
    paths: [scripts/visual-check.mjs, .github/workflows/visual.yml]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/visual-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: artifacts/visual/
          retention-days: 14
